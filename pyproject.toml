[project]
name = "ats"
version = "0.0.1"
description = "Agentic Trauma Life Support — agentic ATLS primary survey on chest X-ray + vitals."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "gradio>=4.40",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "pymupdf>=1.24",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ats"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt files contain natural-language prompt strings that should not be
# hard-wrapped (readability + tokenization concerns); E501 (line too long)
# is intentionally allowed there.
"src/ats/prompts/*.py" = ["E501"]
# The example output JSON literal in examples.py has long quote lines for
# the same reason.
"src/ats/prompts/examples.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
